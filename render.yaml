# Render Blueprint: New > Blueprint > pick this repo. Free plan, no credit card.
# Secrets marked sync:false are entered in the Render dashboard, never committed.
services:
  - type: web
    name: memory-vault
    runtime: docker
    plan: free
    healthCheckPath: /health
    autoDeployTrigger: checksPass   # deploy only after GitHub Actions CI passes
    envVars:
      - key: DATABASE_URL            # Neon "direct" connection string
        sync: false
      - key: PUBLIC_BASE_URL         # e.g. https://memory-vault-xxxx.onrender.com
        sync: false
      - key: AUTH_MODE
        value: github
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: JWT_SIGNING_KEY
        generateValue: true          # Render generates a random secret once
      - key: STORAGE_ENCRYPTION_KEY
        generateValue: true
      - key: EMBEDDINGS
        value: none                  # 512 MB free instances: keyword search only
