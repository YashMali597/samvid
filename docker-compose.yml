# Local Postgres with pgvector:  docker compose up -d
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: vault
      POSTGRES_PASSWORD: vault
      POSTGRES_DB: vault
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    # Superusers bypass Row-Level Security. Create a normal role for the app/tests:
    #   docker compose exec db psql -U vault -c "create role vault_app login password 'app';"
    #   docker compose exec db psql -U vault -c "create database vault_test owner vault_app;"
    #   docker compose exec db psql -U vault -d vault_test -c "create extension vector;"
volumes:
  pgdata:
