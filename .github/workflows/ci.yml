# Free CI on GitHub Actions: runs the full test suite against real Postgres + pgvector.
name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      PGPASSWORD: postgres
      TEST_DATABASE_URL: postgresql://vault_app:app@localhost:5432/vault_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - name: Prepare database (non-superuser role so RLS is enforced)
        run: |
          psql -h localhost -U postgres -c "create role vault_app login password 'app';"
          psql -h localhost -U postgres -c "create database vault_test owner vault_app;"
          psql -h localhost -U postgres -d vault_test -c "create extension vector;"
      - run: pip install -e ".[dev]"
      - run: pytest -q
